name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt == 1 && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  test:
    name: Test and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/customer_site.js
          node --check js/api.js
          node --check js/search.js
          node --check js/config-manager.js
          node --check js/source-health.js
          node --check js/onboarding.js
          node --check js/app.js
          node --check js/player-errors.js
          node --check js/player.js
          node --check js/quick-play.js
          node --check js/experience.js
          node --check js/episode-context.js
          node --check js/modal-accessibility.js
          node --check scripts/smoke-quick-play.mjs
          node --check scripts/smoke-experience.mjs
          node --check js/diagnostics.js
          node --check js/pwa-register.js
          node --check scripts/smoke-browser.mjs
          node --check service-worker.js
          node --check server.mjs

      - name: Check whitespace
        run: git diff --check -- . ':(exclude)package-lock.json'
